services:
  app:
    build: .
    image: factory-issue-tracker:latest
    container_name: factory-issue-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/app.db
      UPLOAD_DIR: /app/data/uploads
      APP_TIMEZONE: Asia/Shanghai
      SESSION_SECRET: ${SESSION_SECRET:?请设置 SESSION_SECRET}
      CRON_SECRET: ${CRON_SECRET:?请设置 CRON_SECRET}
      ENABLE_SCHEDULER: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
